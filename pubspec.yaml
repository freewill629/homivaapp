name: homiva
description: Homiva mobile app MVP built with Flutter, Firebase, and Riverpod.
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.4.9
  go_router: ^13.2.0
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_database: ^10.4.5
  firebase_messaging: ^14.7.9
  firebase_remote_config: ^4.3.8
  firebase_crashlytics: ^3.4.8
  firebase_analytics: ^10.7.2
  fluttertoast: ^8.2.4
  intl: ^0.18.1
  collection: ^1.18.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  google_fonts: ^6.2.1
  qr_code_scanner: ^1.0.1
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.4
  charts_flutter: ^0.12.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.5
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
